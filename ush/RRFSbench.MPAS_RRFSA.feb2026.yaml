metadata:
  description: |-
    Sample pull of winter retros for DTC's MPAS Stoch Physics project.

user:
  MACHINE: HERA
#  ACCOUNT: fv3lam
  ACCOUNT: zrtrr

workflow:
  EXPT_SUBDIR: RRFSbench.MPAS_RRFSA.feb2026
  PREEXISTING_DIR_METHOD: rename
#
  DATE_FIRST_CYCL: '2026020400'
  DATE_LAST_CYCL: '2026020612'
  INCR_CYCL_FREQ: 12
  FCST_LEN_HRS: 60
#  FCST_LEN_HRS: 48
#
#  DATE_FIRST_CYCL: '2026020100'
#  DATE_LAST_CYCL: '2026022812'
#  INCR_CYCL_FREQ: 12
#  FCST_LEN_HRS: 84
#
#  taskgroups:
#  - parm/wflow/getobs.yaml
#  - parm/wflow/obspre.yaml
#  - parm/wflow/obsfcst.yaml
#  - parm/wflow/verify_ens.yaml
  USE_CRON_TO_RELAUNCH: true
  CRON_RELAUNCH_INTVL_MNTS: 1

verification:
  RUN_GETOBS: True
#  RUN_GETOBS: False
#
  RUN_OBSPRE: True
  RUN_FCSTPRE: True
#
#  RUN_VXDET: False
  RUN_VXDET: True
#
  RUN_VXENS: False
#
  RUN_VXTC: False
  RUN_MODE: False 
#
  VX_FIELD_GROUPS: [ "APCP", "ASNOW", "REFC", "RETOP", "SFC", "UPA" ]
  VX_APCP_ACCUMS_HRS: [ 1, 3, 6, 24 ]
  VX_ASNOW_ACCUMS_HRS: [ 6, 24 ]
#
#  CCPA_OBS_DIR: "{{ workflow.EXPTDIR }}/obs_data/ccpa"
#  NOHRSC_OBS_DIR: "{{ workflow.EXPTDIR }}/obs_data/nohrsc"
#  MRMS_OBS_DIR: "{{ workflow.EXPTDIR }}/obs_data/mrms"
#  NDAS_OBS_DIR: "{{ workflow.EXPTDIR }}/obs_data/ndas"
#
  CCPA_OBS_DIR: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/obs_data/ccpa"
  NOHRSC_OBS_DIR: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/obs_data/nohrsc"
  MRMS_OBS_DIR: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/obs_data/mrms"
  NDAS_OBS_DIR: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/obs_data/ndas"
#
  VX_FCST_INPUT_BASEDIR: '/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/model_output/MPAS_RRFSA.untarred_deaccumulated.ASNOW_roundoff_8e-5'
  FCST_SUBDIR_TEMPLATE: '{init?fmt=%Y%m%d?shift=-${time_lag}}/{init?fmt=%Y%m%d%H?shift=-${time_lag}}{{ "/${ensmem_name}" if ensemble.DO_ENSEMBLE }}'
  FCST_FN_TEMPLATE: 'mpas_rrfsa_{init?fmt=%Y%m%d%H?shift=-${time_lag}}_f{lead?fmt=%HH?shift=${time_lag}}.grib2'
#
  VX_MASK: ['CONUS', 'WEST', 'OR_WA_CA']

verification_resources:
  execution:
    deterministic:
      gridstat:
        walltime: 02:00:00
      pointstat:
        walltime: 02:00:00
