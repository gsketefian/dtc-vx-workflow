metadata:
  description: |-
    Sample pull of winter retros for DTC's MPAS Stoch Physics project.

user:
  MACHINE: HERA
#  ACCOUNT: fv3lam
  ACCOUNT: rtrr
#  ACCOUNT: zrtrr

platform:
  TASKTHROTTLE: 350

workflow:
#
  DATE_FIRST_CYCL: '2026020100'
  DATE_LAST_CYCL:  '2026022812'
#
  INCR_CYCL_FREQ: 12
#  FCST_LEN_HRS: 6
  FCST_LEN_HRS: 60
#
  EXPT_SUBDIR: RRFSbench.RRFSv1.feb2026
#  EXPT_SUBDIR: "RRFSbench.RRFSv1.feb2026.fcstlen_{{'%02d' % workflow.FCST_LEN_HRS}}hrs.{{workflow.DATE_FIRST_CYCL}}_to_{{workflow.DATE_LAST_CYCL}}"
  PREEXISTING_DIR_METHOD: rename
#
  USE_CRON_TO_RELAUNCH: true
  CRON_RELAUNCH_INTVL_MNTS: 1

verification:
  RUN_GETOBS: True
#  RUN_GETOBS: False
#
  RUN_OBSPRE: True
  RUN_FCSTPRE: True
#
#  RUN_VXDET: False
  RUN_VXDET: True
#
  RUN_VXENS: False
#
  RUN_VXTC: False
  RUN_MODE: False 
#
#  VX_FIELD_GROUPS: [ "APCP", "ASNOW", "REFC", "RETOP", "SFC", "UPA" ]
  VX_FIELD_GROUPS: [ "APCP", "ASNOW", "REFC", "SFC", "UPA" ]
  VX_APCP_ACCUMS_HRS: [ 1, 3, 6, 24 ]
  VX_ASNOW_ACCUMS_HRS: [ 6, 24 ]
#
  CCPA_OBS_DIR: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/obs_data/ccpa"
  NOHRSC_OBS_DIR: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/obs_data/nohrsc"
  MRMS_OBS_DIR: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/obs_data/mrms"
  NDAS_OBS_DIR: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/obs_data/ndas"
#
  VX_FCST_MODEL_NAME: 'RRFSv1'
  VX_FCST_INPUT_BASEDIR: '/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/model_output/RRFSv1.no_idx.reorg_subdirs.fcstlen_cap_60hr.ASNOW_roundoff_9e-5'
  FCST_SUBDIR_TEMPLATE: '{init?fmt=%Y%m%d?shift=-${time_lag}}/{init?fmt=%Y%m%d%H?shift=-${time_lag}}{{ "/${ensmem_name}" if ensemble.DO_ENSEMBLE }}'
  FCST_FN_TEMPLATE: 'rrfs.t{init?fmt=%H?shift=-${time_lag}}z.prslev.3km.f{lead?fmt=%HHH?shift=${time_lag}}.conus.grib2'
  #FCST_FN_TEMPLATE_PCPCOMBINE_OUTPUT: 'srw.t{init?fmt=%H}z.prslev.{{ verification.VX_FCST_MODEL_NAME }}.${FIELD_GROUP}${ACCUM_HH}h.{valid?fmt=%Y%m%d%H?shift=-${ACCUM_HH}H}_to_{valid?fmt=%Y%m%d%H}.nc'
  FCST_FN_TEMPLATE_PCPCOMBINE_OUTPUT: '{{ verification.VX_FCST_MODEL_NAME }}.t{init?fmt=%H}z.prslev.${FIELD_GROUP}${ACCUM_HH}h.{valid?fmt=%Y%m%d%H?shift=-${ACCUM_HH}H}_to_{valid?fmt=%Y%m%d%H}.nc'
#
#  VX_MASK: ['CONUS', 'WEST', 'OR_WA_CA']
  VX_MASK: ['CONUS', 'WEST', 'EAST', 'OR_WA_CA']

verification_resources:
  execution:
    deterministic:
      gridstat:
        walltime: 03:00:00
      pointstat:
        walltime: 03:00:00
