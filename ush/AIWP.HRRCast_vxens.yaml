metadata:
  description: |-
    Sample pull of winter retros for DTC's MPAS Stoch Physics project.

user:
  MACHINE: HERA
#  ACCOUNT: fv3lam
  ACCOUNT: rtrr
#  ACCOUNT: zrtrr

workflow:
#  EXPT_SUBDIR: AIWP.HRRCast.test
  EXPT_SUBDIR: AIWP.HRRCast
  PREEXISTING_DIR_METHOD: rename
#
  DATE_FIRST_CYCL: '2026040100'
  DATE_LAST_CYCL: '2026040100'
  INCR_CYCL_FREQ: 24
  FCST_LEN_HRS: 24
#
#  taskgroups:
#  - parm/wflow/getobs.yaml
#  - parm/wflow/obspre.yaml
#  - parm/wflow/obsfcst.yaml
#  - parm/wflow/verify_ens.yaml
  USE_CRON_TO_RELAUNCH: true
  CRON_RELAUNCH_INTVL_MNTS: 1

verification:
#  RUN_GETOBS: True
  RUN_GETOBS: False
#
  RUN_OBSPRE: True
  RUN_FCSTPRE: True
#
#  RUN_VXDET: False
  RUN_VXDET: True
#
#  RUN_VXENS: False
  RUN_VXENS: True
#
  RUN_VXTC: False
  RUN_MODE: False 
#
#  VX_FIELD_GROUPS: [ "APCP", "ASNOW", "REFC", "RETOP", "SFC", "UPA" ]
#  VX_APCP_ACCUMS_HRS: [ 1, 3, 6, 24 ]
  VX_FIELD_GROUPS: ["APCP", "REFC"]
  VX_APCP_ACCUMS_HRS: [ 1, 3, 6, 24 ]
#  VX_FIELD_GROUPS: [ "APCP" ]
#  VX_APCP_ACCUMS_HRS: [ 6, 24 ]
#
  CCPA_OBS_DIR: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/obs_data_AIWP/ccpa"
  NOHRSC_OBS_DIR: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/obs_data_AIWP/nohrsc"
  MRMS_OBS_DIR: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/obs_data_AIWP/mrms"
  NDAS_OBS_DIR: "/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/obs_data_AIWP/ndas"
#
  VX_FCST_INPUT_BASEDIR: '/scratch4/BMC/fv3lam/Gerard.Ketefian/DTC_RRFSbench/model_output/HRRRCast-live'
  FCST_SUBDIR_TEMPLATE: '{init?fmt=%Y%m%d?shift=-${time_lag}}/{init?fmt=%H?shift=-${time_lag}}/grib2'
  #FCST_FN_TEMPLATE: 'hrrrcast.{{ "m$(printf %02d $((10#${ENSMEM_INDX})))" if ensemble.DO_ENSEMBLE else "m00" }}.t{init?fmt=%H?shift=-${time_lag}}z.pgrb2.f{lead?fmt=%HH?shift=${time_lag}}'
  FCST_FN_TEMPLATE: 'hrrrcast.{{ "m${ensmem_indx}" if ensemble.DO_ENSEMBLE else "m00" }}.t{init?fmt=%H?shift=-${time_lag}}z.pgrb2.f{lead?fmt=%HH?shift=${time_lag}}'
#
#  VX_MASK: ['CONUS', 'WEST', 'OR_WA_CA']
  VX_MASK: []

ensemble:
#  DO_ENSEMBLE: False
  DO_ENSEMBLE: True
  NUM_ENS_MEMBERS: 3
  NUM_ENS_MEMBERS: 10
#  ENSMEM_INDX_MIN: 0
  VX_NDIGITS_ENSMEM_NAMES: 2
  ENSMEM_NAMES: '{% for m in range(ensemble.ENSINDX_MIN, ensemble.ENSINDX_MAX+1) %}{{ "m%02d, " % m }}{% endfor %}'
#
  DO_NEP: True
  DO_NMEP: True
#  NBRHD_PROB_SHAPE: 'CIRCLE'
#  NBRHD_PROB_WIDTHS: [15, 27]
#  NBRHD_PROB_VLD_THRESH: 0.0
##
#  NMEP_SMOOTH_METHOD: 'GAUSSIAN'
#  NMEP_SMOOTH_SHAPE: 'CIRCLE'
#  NMEP_SMOOTH_WIDTH: 9
#  NMEP_SMOOTH_VLD_THRESH: 0.5
#  NMEP_SMOOTH_GAUSSIAN_RADIUS: 120
#  NMEP_SMOOTH_GAUSSIAN_DX: 81.27

verification_resources:
  execution:
    deterministic:
      gridstat:
        walltime: 02:00:00
      pointstat:
        walltime: 02:00:00
    ensemble:
      genensprod:
        default:
          walltime: 08:00:00
        ndas:
          walltime: 08:00:00
      ensemblestat:
        # Applies to all EnsembleStat tasks.
        walltime: 08:00:00
        # This is to avoid the Out of Memory (OOM) errors that EnsembleStat
        # generates when operating on REFC (with the default value of 2G)
        memory: 16G
      gridstat:
        # Applies to all GridStat_..._ens[mean|prob] tasks.
        walltime: 08:00:00
      pointstat:
        walltime: 08:00:00

