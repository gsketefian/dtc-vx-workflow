#
# This configuration file specifies the field groups, fields, levels,
# and thresholds to use for DETERMINISTIC verification.  The format is
# as follows:
#
# FIELD_GROUP1:
#     FIELD1:
#         LEVEL1: list_of_thresholds
#         LEVEL2: list_of_thresholds
#         ...
#     FIELD2:
#         LEVEL1: list_of_thresholds
#         LEVEL2: list_of_thresholds
#         ...
#     ...
#             
# FIELD_GROUP2:
#     FIELD1:
#         LEVEL1: list_of_thresholds
#         LEVEL2: list_of_thresholds
#         ...
#     FIELD2:
#         LEVEL1: list_of_thresholds
#         LEVEL2: list_of_thresholds
#         ...
#     ...
#
#  ...
#
# If the threshold list for a given combination of field group, field,
# and level is set to the empty string ([]), then all values of that
# field will be included in the verification.
#
# Both the keys that represent field groups, fields, and levels and the
# strings in the list of thresholds may contain the separator string "%%"
# that separates the value of the quantity for the forecast from that for
# the observations.  For example, if a field is set to
#
#   RETOP%%EchoTop18
#
# it means the name of the field in the forecast data is RETOP while its
# name in the observations is EchoTop18.
#
APCP:
    APCP:
        #
        # In terms of water depth, the accumulated precipitation (APCP)
        # depth thresholds we are usually interested in, in both inches
        # and millimeters, are given by
        #
        #     inches      millimeters
        #     ------      -----------
        #       0.00           0.000
        #       0.01           0.254
        #       0.02           0.508
        #       0.05           1.270
        #       0.10           2.540
        #       0.15           3.810
        #       0.25           6.350
        #       0.35           8.890
        #       0.50          12.700
        #       1.00          25.400
        #
        # Note that APCP is usually provided in obs and forecast files in
        # units of kg/m^2.  This is in fact equal to the depth in mm.  This
        # can be shown by first dividing the APCP in kg/m^2 by the density
        # of water (approximately 1000 kg/m^3) and converting the result
        # from m to mm, i.e.
        #
        #   precip depth in mm = [(apcp in kg/m^2)/(water density in kg/m^3)]*(1000 mm/m)
        #                      = [(apcp in kg/m^2)/(1000 kg/m^3)]*(1000 mm/m)
        #                      = (apcp in kg/m^2)*[(1000 mm/m)/(1000 kg/m^3)]
        #                      = (apcp in kg/m^2)*(1 mm-m^2/kg)
        #                      = [(apcp value) kg/m^2]*(1 mm-m^2/kg)
        #                      = (apcp value) mm
        #
        # Thus, the depth thresholds in mm in the table above can be directly
        # used in the threshold lists below.
        #
        A1: ['gt0.0', 'ge0.254', 'ge0.508', 'ge1.27', 'ge2.54']
        A3: ['gt0.0', 'ge0.254', 'ge0.508', 'ge1.27', 'ge2.54', 'ge3.810', 'ge6.350']
        A6: ['gt0.0', 'ge0.254', 'ge0.508', 'ge1.27', 'ge2.54', 'ge3.810', 'ge6.350', 'ge8.890', 'ge12.700']
        A24: ['gt0.0', 'ge0.254', 'ge0.508', 'ge1.27', 'ge2.54', 'ge3.810', 'ge6.350', 'ge8.890', 'ge12.700', 'ge25.400']
ASNOW:
    ASNOW:
        #
        # The thresholds we are generally interested in for snow depth (ASNOW)
        # are as follows (in different units):
        #
        #     inches      centimeters       meters 
        #     ------      -----------      --------
        #        0.0            0.0         0.0    
        #        0.1            0.254       0.00254
        #        1.0            2.54        0.0254 
        #        2.0            5.08        0.0508 
        #        4.0           10.16        0.1016 
        #        8.0           20.32        0.2032 
        #       12.0           30.48        0.3048 
        #
        # Choose one of the following sets of values depending on whether the
        # units of ASNOW in the obs and forecasts are in centimeters or meters.
        #
        # These assume that ASNOW in the obs and forecasts is given in units of cm.
        #A6: ['gt0.0', 'ge2.54', 'ge5.08', 'ge10.16', 'ge20.32']
        #A24: ['gt0.0', 'ge2.54', 'ge10.16', 'ge20.32', 'ge30.48']
        #
        # These assume that ASNOW in the obs and forecasts is given in units of meters.
        A6:  ['gt0.0', 'ge0.00254', 'ge0.0254', 'ge0.0508', 'ge0.1016', 'ge0.2032']
        A24: ['gt0.0', 'ge0.00254', 'ge0.0254', 'ge0.0508', 'ge0.1016', 'ge0.2032', 'ge0.3048']
