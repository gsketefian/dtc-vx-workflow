default_task_obspre: &default_task_obspre
  account: '&ACCOUNT;'
  attrs:
    cycledefs: cycledefs_obs_days_inst
    maxtries: 1
  envars: &default_vars
    GLOBAL_VAR_DEFNS_FP: '&GLOBAL_VAR_DEFNS_FP;'
    USHdir: '&USHdir;'
    YYMMDD:
      cyclestr:
        value: '@Y@m@d'
    HH:
      cyclestr:
        value: '@H'
    MET_INSTALL_DIR: '&MET_INSTALL_DIR;'
    METPLUS_ROOT: '&METPLUS_ROOT;'
    LOGDIR:
      cyclestr:
        value: '&LOGDIR;'
    nprocs: '{{ verification_resources.execution.nodes * verification_resources.execution.tasks_per_node }}'
  join:
    cyclestr:
      value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H&LOGEXT;'
  memory: '{{ "2G" if user.MACHINE not in ["NOAACLOUD"] }}'
  native: '{{ platform.SCHED_NATIVE_CMD }}'
  nodes: '{{ verification_resources.execution.nodes }}:ppn={{ verification_resources.execution.tasks_per_node }}'
  partition: '{{ "&PARTITION_DEFAULT;" if platform.get("PARTITION_DEFAULT") }}'
  queue: '&QUEUE_DEFAULT;'

task_run_MET_Pb2nc_obs_NDAS:
  <<: *default_task_obspre
  attrs:
    cycledefs: cycledefs_obs_days_inst
    maxtries: 2
  command: "&JOBSdir;/PB2NC_OBS.sh"
  envars:
    <<: *default_vars
    OBTYPE: NDAS
  walltime: "{{ verification_resources.execution.pb2nc.walltime }}"
  dependency:
    and:
      datadep:
        value: "&NDAS_OBS_DIR;"
      #
      # Check that the get_obs_ndas task (for the current obs day only) is
      # complete before launching the Pb2nc task that converts that obs day's
      # NDAS prepbufr files to netcdf format.
      #
      # Note that we do not need to check completion of ALL get_obs_ndas tasks
      # (i.e. for all obs days) because the Pb2nc tasks are obs-day-based, i.e.
      # each such task will only operate on one day's worth of NDAS obs.  Thus,
      # we only need the get_obs_ndas task for that day to be complete (recall
      # that the get_obs_ndas tasks are also obs-day-based).
      #
      or:
        not:
          taskvalid:
            attrs:
              task: get_obs_ndas
        taskdep:
          attrs:
            task: get_obs_ndas

metatask_ASCII2nc_obs:
  var:
    METAOBTYPE: '{% for var in verification.VX_FIELD_GROUPS %}{% if var =="AOD" %}AERONET {% elif var in ["PM25", "PM10"] %}AIRNOW {% endif %}{% endfor %}'
    METAOBS_DIR: '{% for var in verification.VX_FIELD_GROUPS %}{% if var =="AOD" %}&AERONET_OBS_DIR; {% elif var in ["PM25", "PM10"] %}&AIRNOW_OBS_DIR; {% endif %}{% endfor %}'
    TASKDEP: '{% for var in verification.VX_FIELD_GROUPS %}{% if var =="AOD" %}get_obs_aeronet {% elif var in ["PM25", "PM10"] %}get_obs_airnow {% endif %}{% endfor %}'
  task_run_MET_ASCII2nc_obs_#METAOBTYPE#:
    <<: *default_task_obspre
    attrs:
      cycledefs: cycledefs_obs_days_inst
      maxtries: 2
    command: "&JOBSdir;/ASCII2NC_OBS.sh"
    walltime: "{{ verification_resources.execution.ascii2nc.walltime }}"
    envars:
      <<: *default_vars
      OBTYPE: '#METAOBTYPE#'
      OBS_DIR: '#METAOBS_DIR#'
      METPLUSTOOLNAME: 'ASCII2NC'
    dependency:
      and:
        datadep:
          value: '#METAOBS_DIR#'
        or:
          not:
            taskvalid:
              attrs:
                task: '#TASKDEP#'
          taskdep:
            attrs:
              task: '#TASKDEP#'

task_run_MET_Point2Grid_obs_GOESAOD:
  <<: *default_task_obspre
  attrs:
    cycledefs: forecast
    maxtries: 2
  command: "&JOBSdir;/POINT2GRID.sh"
  memory: '{{  point2grid.execution.memory if user.MACHINE not in ["NOAACLOUD"] }}'
  walltime: "{{ point2grid.execution.walltime }}"
  envars:
    <<: *default_vars
    OBS_DIR: '&GOESAOD_OBS_DIR;'
    OBTYPE: GOESAOD
    FIELD_GROUP: 'GOESAOD'
  dependency:
    and:
      datadep_aod:
        value: '&GOESAOD_OBS_DIR;'
      datadep_adp:
        value: '&GOESADP_OBS_DIR;'
      # Check that the flag files that indicate that the get_obs_ccpa tasks
      # are complete are all present before launching any PcpCombine task.
      #
      # Need to change the following "command:" entries to call check_flag_file_presence.sh,
      # and pass OBS_DAYS_ALL_CYCLES_INIT in the call instead of OBS_DAYS_ALL_CYCLES_CUMUL
      # because GOESAOD is an instantaneous field/observation, not a cumulative one.
      #
      # QUESTIONS/COMMENTS:
      #
      # 1) Do the Point2Grid_obs tasks operate on obs days or cycles?
      #
      #    If on obs days, then we only need to check that the corresponding tasks
      #    are complete.  In that case, we only need a single task dependency below.
      #
      #    If they operate on cycles, then the get_obs_goesaod and get_obs_goesadp
      #    tasks must be complete for all obs days, so we would need a shell script
      #    dependency below that calls check_flag_file_presence.sh to check the 
      #    presence of all flag files from the get_obs_goesaod and get_obs_goesadp
      #    tasks.
      #
      # 2) In the existing code below, we probably need to change OBS_DAYS_ALL_CYCLES_CUMUL
      #    to OBS_DAYS_ALL_CYCLES_INIT because GOESAOD and GOESADP are instantaneous obs
      #    (as opposed to cumulative like CCPA and NOHRSC).
      #
      sh_goesaod_obs_available:
        attrs:
          shell: /bin/bash
        command: find {{ workflow.WFLOW_FLAG_FILES_DIR }} -name "get_obs_goesaod_*_complete.txt" -exec basename {} \; 2>/dev/null |
          grep -oE '[0-9]{8}' |
          awk -F/ -v s={{ workflow.OBS_DAYS_ALL_CYCLES_CUMUL[0] }} -v e={{ workflow.OBS_DAYS_ALL_CYCLES_CUMUL[-1] }} '($NF >= s && $NF <= e)' |
          test $(wc -l) -ge {{ workflow.OBS_DAYS_ALL_CYCLES_CUMUL|length }}
      sh_goesadp_obs_available:
        attrs:
          shell: /bin/bash
        command: find {{ workflow.WFLOW_FLAG_FILES_DIR }} -name "get_obs_goesadp_*_complete.txt" -exec basename {} \; 2>/dev/null | 
          grep -oE '[0-9]{8}' | 
          awk -F/ -v s={{ workflow.OBS_DAYS_ALL_CYCLES_CUMUL[0] }} -v e={{ workflow.OBS_DAYS_ALL_CYCLES_CUMUL[-1] }} '($NF >= s && $NF <= e)' | 
          test $(wc -l) -ge {{ workflow.OBS_DAYS_ALL_CYCLES_CUMUL|length }}

metatask_PcpCombine_APCP_all_accums_obs_CCPA:
  var:
    ACCUM_HH: '{% for ah in verification.VX_APCP_ACCUMS_HRS %}{% if workflow.FCST_LEN_HRS >= ah %}{{ "%02d " % ah }}{% endif %}{% endfor %}'
  task_run_MET_PcpCombine_APCP#ACCUM_HH#h_obs_CCPA:
    <<: *default_task_obspre
    attrs:
      cycledefs: forecast
      maxtries: 2
    command: "&JOBSdir;/PCPCOMBINE.sh"
    walltime: "{{ verification_resources.execution.pcpcombine.obs.walltime }}"
    envars:
      <<: *default_vars
      FIELD_GROUP: 'APCP'
      ACCUM_HH: '#ACCUM_HH#'
      FCST_OR_OBS: OBS
      OBTYPE: CCPA
      OBS_DIR: '&CCPA_OBS_DIR;'
      OBS_AVAIL_INTVL_HRS: '{{ verification.CCPA_OBS_AVAIL_INTVL_HRS }}'
      METPLUSTOOLNAME: 'PCPCOMBINE'
    dependency:
      and:
        datadep:
          value: "&CCPA_OBS_DIR;"
        #
        # Check that the flag files that indicate that the get_obs_ccpa tasks are
        # complete are ALL present before launching any PcpCombine tasks that need
        # CCPA obs.
        #
        # Note that we wait until the CCPA files are available for ALL obs days
        # because if the forecasts happen to be longer than 24 hours, a single
        # PcpCombine task (corresponding to a given init time) will require more
        # than one day's worth of CCPA obs.
        #
        sh_ccpa_obs_available:
          attrs:
            shell: /bin/bash
          command: '{% if verification.RUN_GETOBS %}
                        &USHdir;/check_flag_file_presence.sh
                          "{{workflow.WFLOW_FLAG_FILES_DIR}}"
                          "get_obs_ccpa_*_complete.txt"
                          "{{ workflow.OBS_DAYS_ALL_CYCLES_CUMUL[0] }}"
                          "{{ workflow.OBS_DAYS_ALL_CYCLES_CUMUL[-1] }}"
                          "{{ workflow.OBS_DAYS_ALL_CYCLES_CUMUL|length }}"
                    {% else %}true{% endif %}'

metatask_PcpCombine_ASNOW_all_accums_obs_NOHRSC:
  var:
    ACCUM_HH: '{% for ah in verification.VX_ASNOW_ACCUMS_HRS %}{% if workflow.FCST_LEN_HRS >= ah %}{{ "%02d " % ah }}{% endif %}{% endfor %}'
  task_run_MET_PcpCombine_ASNOW#ACCUM_HH#h_obs_NOHRSC:
    <<: *default_task_obspre
    attrs:
      cycledefs: forecast
      maxtries: 2
    command: "&JOBSdir;/PCPCOMBINE.sh"
    envars:
      <<: *default_vars
      FIELD_GROUP: 'ASNOW'
      ACCUM_HH: '#ACCUM_HH#'
      FCST_OR_OBS: OBS
      OBTYPE: NOHRSC
      OBS_DIR: '&NOHRSC_OBS_DIR;'
      OBS_AVAIL_INTVL_HRS: '{{ verification.NOHRSC_OBS_AVAIL_INTVL_HRS }}'
      METPLUSTOOLNAME: 'PCPCOMBINE'
    walltime: "{{ verification_resources.execution.pcpcombine.obs.walltime }}"
    dependency:
      and:
        datadep:
          value: "&NOHRSC_OBS_DIR;"
        #
        # Check that the flag files that indicate that the get_obs_nohrsc tasks are
        # complete are ALL present before launching any PcpCombine tasks that need
        # NOHRSC obs.
        #
        # Note that we wait until the NOHRSC files are available for ALL obs days
        # because if the forecasts happen to be longer than 24 hours, a single
        # PcpCombine task (corresponding to a given init time) will require more
        # than one day's worth of NOHRSC obs.
        #
        sh_nohrsc_obs_available:
          attrs:
            shell: /bin/bash
          command: '{% if verification.RUN_GETOBS %}
                        &USHdir;/check_flag_file_presence.sh
                          "{{workflow.WFLOW_FLAG_FILES_DIR}}"
                          "get_obs_nohrsc_*_complete.txt"
                          "{{ workflow.OBS_DAYS_ALL_CYCLES_CUMUL[0] }}"
                          "{{ workflow.OBS_DAYS_ALL_CYCLES_CUMUL[-1] }}"
                          "{{ workflow.OBS_DAYS_ALL_CYCLES_CUMUL|length }}"
                    {% else %}true{% endif %}'

