    <<: *default_metatask_PointStat_var
    FIELD_GROUP: 'PM25 PM10 '
    METAOBTYPE: 'AIRNOW AIRNOW '
    METAOBS_DIR: '&AIRNOW_OBS_DIR; &AIRNOW_OBS_DIR; '
